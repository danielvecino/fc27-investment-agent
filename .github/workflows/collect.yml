name: FC27 price collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: fc27-price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and collect FUT.GG prices
        run: |
          python - <<'PY'
          import csv
          import html as htmlmod
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          URL = "https://www.fut.gg/cheapest-by-rating/"

          TARGETS = {
              "Bellingham": r"Bellingham",
              "Haaland": r"Haaland",
              "Rodri": r"Rodri",
              "Kane": r"Kane",
              "Vitinha": r"Vitinha",
              "Pedri": r"Pedri",
              "Olise": r"Olise",
              "Aitana": r"Aitana(?:\s+Bonmat[ií])?",
              "Yamal": r"(?:Lamine\s+)?Yamal",
              "Mbappe": r"Mbapp[eé]",
          }

          POSITIONS = (
              "GK|RB|RWB|CB|LB|LWB|"
              "CDM|CM|CAM|RM|RW|LM|LW|"
              "CF|ST"
          )

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent":
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode("utf-8", "replace")
              status = response.status

          print("HTTP:", status)
          print("Bytes:", len(raw))

          if status != 200:
              raise SystemExit(f"HTTP inesperado: {status}")

          if len(raw) < 10000:
              raise SystemExit("Respuesta HTML sospechosamente pequeña")

          # HTML solo para diagnóstico del run.
          # No se incorpora al repositorio.
          Path("debug").mkdir(exist_ok=True)
          Path("debug/page.html").write_text(
              raw,
              encoding="utf-8"
          )

          # Convertimos la página a texto.
          text = re.sub(
              r"<script\b[^>]*>.*?</script>",
              " ",
              raw,
              flags=re.I | re.S,
          )

          text = re.sub(
              r"<style\b[^>]*>.*?</style>",
              " ",
              text,
              flags=re.I | re.S,
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = htmlmod.unescape(text)
          text = re.sub(r"\s+", " ", text).strip()

          def parse_price(value):
              return int(value.replace(",", ""))

          results = {}

          for key, player_pattern in TARGETS.items():

              # Estructura observada:
              #
              # Rodri 11,750 CDM 90
              # Kane 14,000 ST 90
              # Bellingham 121,000 CAM 90
              #
              # El precio DEBE estar después del nombre.
              pattern = re.compile(
                  rf"\b(?P<name>{player_pattern})\b"
                  rf"\s+"
                  rf"(?P<price>\d{{1,3}}(?:,\d{{3}})+)"
                  rf"\s+"
                  rf"(?P<position>{POSITIONS})"
                  rf"\s+"
                  rf"(?P<rating>\d{{2}})"
                  rf"\b",
                  re.I,
              )

              matches = list(pattern.finditer(text))

              if not matches:
                  print(f"NO MATCH: {key}")
                  continue

              # Puede haber varias cartas del mismo jugador.
              # De momento escogemos la primera aparición,
              # conservando rating/posición para identificarla.
              match = matches[0]

              price = parse_price(match.group("price"))
              rating = int(match.group("rating"))
              position = match.group("position").upper()
              matched_name = match.group("name")

              if not (500 <= price <= 20_000_000):
                  print(
                      f"PRECIO INVALIDO: {key} -> {price}"
                  )
                  continue

              if not (75 <= rating <= 99):
                  print(
                      f"RATING INVALIDO: {key} -> {rating}"
                  )
                  continue

              results[key] = {
                  "name": matched_name,
                  "price": price,
                  "position": position,
                  "rating": rating,
              }

          timestamp = datetime.now(
              timezone.utc
          ).isoformat()

          print()
          print("========== SNAPSHOT ==========")

          print(
              json.dumps(
                  {
                      "timestamp": timestamp,
                      "players": results,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )

          print()
          print(
              f"REGISTROS VALIDOS: "
              f"{len(results)}/{len(TARGETS)}"
          )

          # No guardamos nada si el parser deja de funcionar.
          if len(results) < 8:
              raise SystemExit(
                  "VALIDATION FAILED: "
                  f"solo {len(results)}/10 jugadores"
              )

          # Este primer CSV contenía datos del parser defectuoso.
          # Si detectamos exactamente el formato antiguo,
          # lo reiniciamos para no contaminar el histórico.
          output = Path("data/prices.csv")

          old_bad_snapshot = False

          if output.exists():
              try:
                  existing = output.read_text(
                      encoding="utf-8"
                  )

                  if (
                      "2026-09-17T12:39:33.353384+00:00"
                      in existing
                      and "Bellingham,14000" in existing
                      and "Rodri,180000" in existing
                  ):
                      old_bad_snapshot = True

              except Exception:
                  pass

          if old_bad_snapshot:
              print(
                  "Eliminando snapshot inicial defectuoso."
              )
              output.unlink()

          output.parent.mkdir(exist_ok=True)

          new_file = not output.exists()

          with output.open(
              "a",
              newline="",
              encoding="utf-8",
          ) as f:

              writer = csv.writer(f)

              if new_file:
                  writer.writerow([
                      "timestamp_utc",
                      "player",
                      "rating",
                      "position",
                      "price",
                      "source",
                  ])

              for player, data in results.items():
                  writer.writerow([
                      timestamp,
                      player,
                      data["rating"],
                      data["position"],
                      data["price"],
                      URL,
                  ])

          print()
          print(
              f"Snapshot válido guardado: "
              f"{len(results)} registros"
          )
          PY

      - name: Save diagnostic HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futgg-debug-${{ github.run_id }}
          path: debug/page.html
          retention-days: 1

      - name: Commit validated price history
        run: |
          git config user.name "fc27-price-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/prices.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m \
              "data: validated FC27 snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"

            git push
          fi
