name: FC27 price collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: fc27-price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and collect FUT.GG prices
        run: |
          python - <<'PY'
          import csv
          import html as htmlmod
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          URL = "https://www.fut.gg/cheapest-by-rating/"

          TARGETS = [
              "Bellingham",
              "Haaland",
              "Rodri",
              "Kane",
              "Vitinha",
              "Pedri",
              "Olise",
              "Aitana",
              "Yamal",
              "Mbapp",
          ]

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent":
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode("utf-8", "replace")
              print("HTTP:", r.status)
              print("Bytes:", len(raw))

          Path("debug").mkdir(exist_ok=True)
          Path("debug/page.html").write_text(raw, encoding="utf-8")

          text = re.sub(
              r"<script\b[^>]*>.*?</script>",
              " ",
              raw,
              flags=re.I | re.S,
          )

          text = re.sub(
              r"<style\b[^>]*>.*?</style>",
              " ",
              text,
              flags=re.I | re.S,
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = htmlmod.unescape(text)
          text = re.sub(r"\s+", " ", text)

          def parse_number(value):
              value = (
                  value.lower()
                  .replace(",", "")
                  .replace(" ", "")
              )

              m = re.fullmatch(
                  r"(\d+(?:\.\d+)?)([km]?)",
                  value,
              )

              if not m:
                  return None

              number = float(m.group(1))
              unit = m.group(2)

              if unit == "k":
                  number *= 1000
              elif unit == "m":
                  number *= 1000000

              return int(number)

          prices = {}
          diagnostics = {}

          for player in TARGETS:
              match = re.search(
                  re.escape(player),
                  text,
                  re.IGNORECASE,
              )

              if not match:
                  diagnostics[player] = "NAME NOT FOUND"
                  continue

              window = text[
                  max(0, match.start() - 80):
                  match.end() + 350
              ]

              diagnostics[player] = window

              candidates = re.findall(
                  r"(?<![\w.])"
                  r"(\d{1,3}(?:,\d{3})+|"
                  r"\d+(?:\.\d+)?\s*[kKmM])"
                  r"(?!\w)",
                  window,
              )

              values = []

              for candidate in candidates:
                  value = parse_number(candidate)

                  if value and 500 <= value <= 20000000:
                      values.append(value)

              if values:
                  prices[player] = values[0]

          timestamp = datetime.now(
              timezone.utc
          ).isoformat()

          print()
          print("========== RESULTADO ==========")

          print(
              json.dumps(
                  {
                      "timestamp": timestamp,
                      "prices": prices,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )

          print()
          print("========== CONTEXTO ==========")

          for player, context in diagnostics.items():
              print(
                  player,
                  repr(context[:430])
              )

          print()
          print(
              f"PRECIOS EXTRAIDOS: "
              f"{len(prices)}/{len(TARGETS)}"
          )

          if len(prices) < 8:
              raise SystemExit(
                  "SAFETY CHECK FAILED: "
                  f"solo {len(prices)}/10 precios"
              )

          output = Path("data/prices.csv")
          output.parent.mkdir(exist_ok=True)

          new_file = not output.exists()

          with output.open(
              "a",
              newline="",
              encoding="utf-8",
          ) as f:

              writer = csv.writer(f)

              if new_file:
                  writer.writerow([
                      "timestamp_utc",
                      "player",
                      "price",
                      "source",
                  ])

              for player in TARGETS:
                  if player in prices:
                      writer.writerow([
                          timestamp,
                          player,
                          prices[player],
                          URL,
                      ])

          print()
          print(
              f"STORED {len(prices)} prices "
              f"in {output}"
          )
          PY

      - name: Save diagnostic HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futgg-debug-${{ github.run_id }}
          path: debug/page.html
          retention-days: 1

      - name: Commit price history
        run: |
          git config user.name "fc27-price-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/prices.csv

          if git diff --cached --quiet; then
            echo "No snapshot to commit"
          else
            git commit -m \
              "data: FC27 snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"

            git push
          fi
