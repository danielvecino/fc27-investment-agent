name: Prueba acceso FUT.GG

on:
  workflow_dispatch:

jobs:
  test-futgg:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar FUT.GG
        run: |
          python - <<'PY'
          import urllib.request
          import re
          from datetime import datetime, timezone

          url = "https://www.fut.gg/cheapest-by-rating/"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          )

          print("Timestamp:", datetime.now(timezone.utc).isoformat())
          print("Solicitando:", url)

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")
              print("HTTP:", response.status)
              print("Bytes:", len(html))

          players = [
              "Bellingham",
              "Haaland",
              "Rodri",
              "Kane",
              "Vitinha",
              "Pedri",
              "Olise",
              "Aitana",
              "Yamal",
              "Mbapp",
          ]

          print("\n--- COMPROBACIÓN ---")

          found = 0

          for player in players:
              ok = bool(re.search(player, html, re.IGNORECASE))
              print(f"{player:12} {'ENCONTRADO' if ok else 'NO ENCONTRADO'}")
              found += int(ok)

          print(f"\nJugadores encontrados: {found}/{len(players)}")

          if len(html) < 10000:
              raise SystemExit("ERROR: respuesta sospechosamente pequeña")

          if found < 8:
              raise SystemExit("ERROR: FUT.GG respondió, pero no encontramos suficientes jugadores")

          print("\nPRUEBA SUPERADA: GitHub Actions puede acceder a FUT.GG.")
          PY
