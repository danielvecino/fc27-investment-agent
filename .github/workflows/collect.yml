      - name: Collect dynamic FUT.GG universe
        run: |
          python - <<'PY'
          import csv, hashlib, html as htmlmod, json, re, urllib.request, uuid
          from datetime import datetime, timezone
          from pathlib import Path

          URL = "https://www.fut.gg/cheapest-by-rating/"
          OUT = Path("data/market_prices.csv")
          SNAPSHOTS = Path("data/snapshots.csv")
          DEBUG = Path("debug/page.html")

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              raw_bytes = response.read()
              status = response.status

          if status != 200 or len(raw_bytes) < 10000:
              raise SystemExit(f"Respuesta FUT.GG inválida: HTTP={status}, bytes={len(raw_bytes)}")

          raw = raw_bytes.decode("utf-8", "replace")
          page_sha = hashlib.sha256(raw_bytes).hexdigest()
          timestamp = datetime.now(timezone.utc).isoformat()
          snapshot_id = uuid.uuid4().hex[:16]

          DEBUG.parent.mkdir(exist_ok=True)
          DEBUG.write_text(raw, encoding="utf-8")

          # Cada tarjeta de cheapest-by-rating contiene una URL estable /27-ID/,
          # nombre, precio, posición y GRL. El ID evita confundir versiones.
          card_re = re.compile(
              r'href="/players/(?P<base>\d+)-[^"]+/27-(?P<item>\d+)/"[^>]*>'
              r'.*?<img[^>]+alt="(?P<name>[^"]+)"[^>]*>'
              r'.*?<img src="/public-assets/coin\.webp"[^>]*/>(?P<price>[\d,]+)'
              r'.*?<div class="rounded h-\[30px\] w-\[30px\][^"]*">(?P<position>[A-Z]+)</div>'
              r'<div class="rounded h-\[30px\] w-\[30px\][^"]*">(?P<rating>\d{2})</div>',
              re.S,
          )

          cards = {}
          for m in card_re.finditer(raw):
              card_id = f"27-{m.group('item')}"
              price = int(m.group("price").replace(",", ""))
              rating = int(m.group("rating"))
              if not 150 <= price <= 20_000_000 or not 70 <= rating <= 99:
                  continue
              cards[card_id] = {
                  "card_id": card_id,
                  "base_id": m.group("base"),
                  "name": htmlmod.unescape(m.group("name")).strip(),
                  "rating": rating,
                  "position": m.group("position"),
                  "price": price,
              }

          print(f"HTTP {status} | bytes={len(raw_bytes)} | sha256={page_sha}")
          print(f"Snapshot {snapshot_id} | cartas únicas={len(cards)}")
          print("Ratings:", sorted({c["rating"] for c in cards.values()}))

          # El artefacto inspeccionado previamente daba 122 cartas.
          # Permitimos cambios naturales en la página, pero fallamos si el parser se rompe.
          if len(cards) < 80:
              raise SystemExit(f"Parser sospechoso: solo {len(cards)} cartas")

          OUT.parent.mkdir(exist_ok=True)
          new = not OUT.exists()
          with OUT.open("a", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              if new:
                  w.writerow([
                      "timestamp_utc","snapshot_id","page_sha256","card_id","base_id",
                      "name","rating","position","price","source"
                  ])
              for c in sorted(cards.values(), key=lambda x: (x["rating"], x["price"], x["card_id"])):
                  w.writerow([
                      timestamp,snapshot_id,page_sha,c["card_id"],c["base_id"],c["name"],
                      c["rating"],c["position"],c["price"],URL
                  ])

          snap_new = not SNAPSHOTS.exists()
          with SNAPSHOTS.open("a", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              if snap_new:
                  w.writerow(["timestamp_utc","snapshot_id","page_sha256","cards","min_rating","max_rating","source"])
              ratings = [c["rating"] for c in cards.values()]
              w.writerow([timestamp,snapshot_id,page_sha,len(cards),min(ratings),max(ratings),URL])

          print(json.dumps(list(cards.values())[:10], ensure_ascii=False, indent=2))
          PY

      - name: Validate dataset
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          rows = list(csv.DictReader(Path("data/market_prices.csv").open(encoding="utf-8")))
          snaps = Counter(r["snapshot_id"] for r in rows)
          if not rows:
              raise SystemExit("Dataset vacío")
          if min(snaps.values()) < 80:
              raise SystemExit(f"Snapshot incompleto detectado: {snaps}")
          if len({(r["snapshot_id"], r["card_id"]) for r in rows}) != len(rows):
              raise SystemExit("Duplicados snapshot/card_id")
          print("DATASET OK")
          print("Snapshots:", len(snaps))
          print("Filas:", len(rows))
          print("Último snapshot:", list(snaps.items())[-1])
          PY

      - name: Build v4 advisor, outcomes and event reactions
        run: |
          # Advisor treats matching parsed-market hashes as a single observation,
          # even when FUT.GG returns the same page on multiple scraper runs.
          python src/advisor.py data
          python src/outcomes.py data
          python src/events.py data
          python -m unittest discover -s tests -v

      - name: Save diagnostic HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futgg-debug-${{ github.run_id }}
          path: debug/page.html
          retention-days: 1

      - name: Commit market database
        run: |
          git config user.name "fc27-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/*.py tests/*.py README.md .gitignore docs/model.md data/*.csv data/*.md data/*.json data/snapshots.csv data/advisor_watchlist.csv data/advisor_report.md data/signal_outcomes.csv data/event_reactions.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: FC27 advisor v4 $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
